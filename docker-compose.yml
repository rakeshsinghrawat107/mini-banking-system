version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  banking-app:
    build: .
    container_name: banking-app
    restart: always
    depends_on:
      - postgres
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/postgres?sslmode=disable
      - BANK_TZ=Asia/Kolkata
    ports:
      - "8080:8080"

volumes:
  pgdata:
